name: lr16

x-database-env: &database-env
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory-local}

services:
  db:
    image: postgres:16
    environment: *database-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      <<: *database-env
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:${API_PORT:-8016}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
